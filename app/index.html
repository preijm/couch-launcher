<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <title>Tegel</title>
  <meta name="viewport" content="width=1920, height=1080">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="bg"></div>
  <div id="shade"></div>

  <main id="screen">
    <header id="top">
      <div id="brand">Tegel</div>
      <div id="clockwrap">
        <div id="clock">--:--</div>
        <div id="date"></div>
      </div>
    </header>

    <section class="row">
      <h2 class="row-title">Apps</h2>
      <div class="tiles" id="row-apps"></div>
    </section>

    <section class="row">
      <h2 class="row-title">Ingangen</h2>
      <div class="tiles" id="row-inputs"></div>
    </section>
  </main>

  <div id="toast"></div>

  <script src="js/config.js"></script>
  <script src="js/luna.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
